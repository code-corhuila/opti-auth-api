# The service of the auth domain. Reachable only inside the platform network: no published port.
name: opti-auth-api

services:
  auth-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opti/auth-api:local
    environment:
      DATABASE_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME:-auth}
      DATABASE_USER: ${AUTH_DB_USER:-auth_owner}
      DATABASE_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY (public key of the identity service)}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY (private key of the identity service)}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-60}
    networks:
      - platform
    expose:
      - "8080"
    restart: unless-stopped

networks:
  platform:
    external: true
